<style>
  /* Layout: full-bleed pixel canvas, menus float over it as rusted metal panels with terminal text. */
  :root {
    --ink: #120e0b;          /* night wasteland */
    --panel: #2a1f17;        /* rusted plate */
    --panel-deep: #1b140f;
    --edge: #7b5634;         /* worn edge */
    --rivet: #a37a52;
    --phosphor: #9cf08a;     /* terminal green */
    --phosphor-dim: #4f8a47;
    --amber: #f0b23e;        /* warning lamp */
    --blood: #d2452c;
    --bone: #e9dcc0;
    --muted: #b8a588;
    --font-display: "VT323", "Share Tech Mono", ui-monospace, monospace;
    --font-body: "Share Tech Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    font-size: 15px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: var(--ink);
  }
  #ui {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: safe center;
    overflow-y: auto;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: radial-gradient(ellipse at center, rgba(18,14,11,0.55), rgba(18,14,11,0.88));
  }
  #ui[hidden] { display: none; }
  .screen { width: min(100%, 760px); display: grid; gap: 18px; }

  .panel {
    position: relative;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, var(--panel), var(--panel-deep));
    border: 2px solid var(--edge);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,220,170,0.08), 0 8px 30px rgba(0,0,0,0.5);
    padding: 18px 20px;
    min-width: 0;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    top: 6px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--rivet), #3a2618);
  }
  .panel::before { left: 6px; }
  .panel::after { right: 6px; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
  h1 {
    font-size: clamp(56px, 12vw, 104px);
    line-height: 0.85;
    color: var(--amber);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(240,178,62,0.35), 3px 3px 0 #3a2210;
  }
  h2 { font-size: 34px; color: var(--phosphor); text-shadow: 0 0 10px rgba(156,240,138,0.35); }
  h3 { font-size: 22px; color: var(--amber); }
  p { margin: 0; line-height: 1.5; max-width: 65ch; }
  code { color: var(--phosphor); }

  .eyebrow { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--phosphor-dim); }
  .title-head { display: grid; gap: 10px; }
  .lede { color: var(--muted); }
  .title-grid { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
  .start-panel, .art-panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .art-panel code { overflow-wrap: anywhere; }
  .art-panel h2 { font-size: 26px; }
  .hint { color: var(--muted); font-size: 13px; }

  .record { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-block: 10px; border-block: 1px solid #3a2c20; }
  .record div { display: grid; gap: 2px; min-width: 0; }
  .record dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .record dd { margin: 0; font: 22px/1 var(--font-display); color: var(--amber); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .stash { color: var(--muted); }
  .stash strong { color: var(--amber); font-weight: 400; }
  .controls { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; font-size: 13px; }
  .controls div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
  .controls dt { color: var(--amber); text-transform: uppercase; letter-spacing: 0.08em; }
  .controls dd { margin: 0; color: var(--muted); }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font: 22px/1 var(--font-display);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--phosphor);
    background: #0f160d;
    border: 2px solid var(--phosphor-dim);
    padding: 10px 18px;
    cursor: pointer;
    text-shadow: 0 0 8px rgba(156,240,138,0.4);
    user-select: none;
  }
  .btn:hover, .btn.is-focus, .btn:focus-visible {
    background: var(--phosphor);
    color: var(--ink);
    border-color: var(--phosphor);
    text-shadow: none;
    outline: none;
  }
  .btn[disabled] { opacity: 0.5; pointer-events: none; }
  .btn-big { font-size: 34px; padding: 16px 20px; width: 100%; }
  .btn-quiet { color: var(--muted); border-color: #4a3a2b; background: transparent; text-shadow: none; }
  .btn-quiet:hover, .btn-quiet.is-focus { background: var(--muted); color: var(--ink); border-color: var(--muted); }

  .status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
  .status[data-kind="ok"] { color: var(--phosphor); }
  .status[data-kind="error"] { color: var(--blood); }
  .lineup {
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: 300 / 70;
    image-rendering: pixelated;
    background: linear-gradient(#000 0 0) bottom / 100% 1px no-repeat, rgba(0,0,0,0.25);
    border-top: 1px solid #3a2c20;
  }

  .levelup { text-align: center; justify-items: center; }
  .levelup h2 { font-size: 56px; color: var(--amber); text-shadow: 0 0 16px rgba(240,178,62,0.4); }
  .sub { color: var(--muted); }
  .cards { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .card {
    appearance: none;
    position: relative;
    display: grid;
    gap: 8px;
    align-content: start;
    text-align: left;
    min-height: 170px;
    padding: 16px 16px 18px;
    background: linear-gradient(170deg, var(--panel), var(--panel-deep));
    border: 2px solid var(--edge);
    color: var(--bone);
    font: inherit;
    cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .card { grid-template-columns: minmax(0, 1fr); }
  .card-art { display: flex; align-items: center; justify-content: center; height: 64px; }
  .card-art img { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; max-height: 100%; }
  .card-art img.icon { width: 54px; height: 54px; }
  .chest-art { display: flex; justify-content: center; }
  .chest-art img { image-rendering: pixelated; max-height: 90px; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
  .card .key { font: 20px/1 var(--font-display); color: var(--phosphor-dim); }
  .card .tag { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--amber); }
  .card .name { font: 30px/0.95 var(--font-display); color: var(--phosphor); }
  .card .desc { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .card:hover, .card.is-focus {
    border-color: var(--phosphor);
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px var(--phosphor), 0 0 24px rgba(156,240,138,0.18);
    outline: none;
  }

  .pause, .end, .chest { width: min(100%, 520px); }
  .chest { justify-items: stretch; }
  .chest-list { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .loadout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .loadout ul, .dmg { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .loadout li { display: flex; justify-content: space-between; gap: 8px; }
  .loadout li span { color: var(--amber); font-variant-numeric: tabular-nums; }

  .end h2.lost { color: var(--blood); text-shadow: 0 0 12px rgba(210,69,44,0.4); font-size: 52px; }
  .end h2.won { color: var(--amber); font-size: 46px; }
  .stats { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stats div { display: grid; gap: 2px; }
  .stats dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .stats dd { margin: 0; font: 32px/1 var(--font-display); color: var(--phosphor); font-variant-numeric: tabular-nums; }
  .dmg li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.5em; gap: 10px; align-items: center; }
  .dmg .bar { height: 6px; background: #1c140e; }
  .dmg .bar i { display: block; height: 100%; background: var(--amber); }
