# Builds the Windows, Mac and Linux downloads and attaches them to a GitHub release.
# Runs when a version tag like v0.3.0 is pushed, or by hand from the Actions tab with a version
# number. Run by hand, it creates the tag on the current commit itself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, like v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist
            files: desktop/release/*.AppImage
          - os: windows-latest
            script: dist:win
            files: desktop/release/*.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds. No certificates are used.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Rad Survivors ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
